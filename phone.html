<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Shrimp Mode - Phone</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px;
    }
    .card {
      background: #161b22;
      border-radius: 16px;
      padding: 32px 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .emoji { font-size: 48px; margin-bottom: 12px; }
    h1 { font-size: 22px; margin-bottom: 8px; color: #ff6b35; }
    p { font-size: 14px; color: #8b949e; margin-bottom: 24px; }
    .score { font-size: 64px; font-weight: 700; color: #ff6b35; line-height: 1; }
    .level { font-size: 16px; color: #8b949e; margin: 8px 0 24px; }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-recover { background: #ff6b35; color: #fff; }
    .btn-report { background: #30363d; color: #e6edf3; }
    .btn-home { background: transparent; color: #8b949e; border: 1px solid #30363d; }
    .connected {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #3fb950;
      margin-bottom: 16px;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #3fb950;
      border-radius: 50%;
    }
    .msg { font-size: 12px; color: #3fb950; margin-top: 12px; min-height: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🦐</div>
    <h1>Shrimp Mode</h1>
    <div class="connected" id="status"><span class="dot"></span> Connected</div>
    <div class="score" id="score">--</div>
    <p class="level" id="level">Loading...</p>
    <button class="btn btn-recover" id="btn-recover">I recovered!</button>
    <button class="btn btn-report" id="btn-report">View Damage Report</button>
    <button class="btn btn-home" id="btn-home">Open on desktop</button>
    <div class="msg" id="msg"></div>
  </div>

  <script>
    // Connect to desktop via BroadcastChannel
    const bc = new BroadcastChannel('shrimp-companion');
    bc.postMessage({ type: 'phone-connected' });

    const scoreEl = document.getElementById('score');
    const levelEl = document.getElementById('level');
    const msgEl = document.getElementById('msg');
    const btnRecover = document.getElementById('btn-recover');
    const btnReport = document.getElementById('btn-report');
    const btnHome = document.getElementById('btn-home');
    const statusEl = document.getElementById('status');

    // Poll IndexedDB for session data
    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('shrimp-mode', 1);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function loadLatestSession() {
      try {
        const db = await openDB();
        const tx = db.transaction('sessions', 'readonly');
        const store = tx.objectStore('sessions');
        const sessions = [];
        const cursorReq = store.openCursor(null, 'prev');
        cursorReq.onsuccess = (e) => {
          const cursor = e.target.result;
          if (cursor && sessions.length < 1) {
            sessions.push(cursor.value);
            cursor.continue();
          }
        };
        tx.oncomplete = () => {
          if (sessions.length > 0) {
            const s = sessions[0];
            const signals = s.signals || [];
            const latest = signals.length > 0 ? signals[signals.length - 1] : null;
            if (latest) {
              scoreEl.textContent = latest.shrimp_score;
              levelEl.textContent = 'Level ' + latest.level + ' — ' + (s.work_mode || 'general');
            }
            statusEl.innerHTML = '<span class="dot"></span> Connected — ' + (s.work_mode || 'general');
          }
        };
      } catch (e) {
        statusEl.textContent = 'Waiting for desktop...';
      }
    }

    // Poll every 3 seconds
    loadLatestSession();
    setInterval(loadLatestSession, 3000);

    // Recovery button
    btnRecover.addEventListener('click', () => {
      bc.postMessage({ type: 'phone-recovery', action: 'stand_up_60s' });
      msgEl.textContent = 'Recovery sent to desktop! 🔄';
      setTimeout(() => msgEl.textContent = '', 3000);
    });

    btnReport.addEventListener('click', () => {
      bc.postMessage({ type: 'phone-report' });
      msgEl.textContent = 'Opening report...';
      setTimeout(() => msgEl.textContent = '', 3000);
    });

    btnHome.addEventListener('click', () => {
      window.open('/', '_blank');
    });
  </script>
</body>
</html>
